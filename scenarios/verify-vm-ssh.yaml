# Bestellen, nach dem Merge per SSH prüfen (ADR 0003). merge: human (ADR
# 0004): den Pull Request merged ein Mensch während des Laufs; das Zertifikat
# gilt 30 Minuten ab Start. In einem Rutsch: verify-vm-ssh-auto.
name: verify-vm-ssh
personas: [developer]
labs: [labul]
capabilities: [ssh]
merge: human
goal: >
  Du brauchst eine kleine Ubuntu-VM namens persona-ssh-check für einen kurzen
  Test. Bestell für dein Team ai-personas, damit deine Teamkollegen die Bestellung auch sehen. Bestell sie, warte, bis sie fertig ist (den Pull Request merged ein
  Kollege), melde dich dann auf ihr an und prüf, ob sie wirklich Ubuntu ist und
  wie viele CPUs und wie viel Speicher sie hat. Sag am Ende, was du bestellt
  hast und was du auf der VM gesehen hast.
expect:
  - verifier: order-pr
  - verifier: order-owner       # owner group:default/ai-personas, in der Order und im Claim
  - verifier: xr-ready
    timeout: 20m
  - verifier: ssh-login       # die Antwort nennt OS, CPUs und Speicher der VM
cleanup: delete-claim
ttl: 1h
