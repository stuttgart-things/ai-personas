---
# Runner image (runner/Containerfile) with the stuttgart-things Dagger docker
# module, like stage-time's sthings-ansible build. The Containerfile stays the
# one definition of the image (docker build, task build and CI); Dagger only
# drives the build.
#
# PR / dispatch: build to ttl.sh, smoke test, Trivy. No ghcr writes.
# main:          build once to ghcr :<sha>, smoke test, Trivy, crane :latest.
# The tag is the commit, so a pipeline's runnerImage and aiPersonasRevision
# (publish-run) can name the same one.
name: Runner image
on:
  pull_request:
    branches: [main]
    paths:
      - runner/**
      - personas/**
      - scenarios/**
      - surfaces/**
      - tests/**
      - Taskfile.yaml
      - .github/workflows/runner-image.yaml
  push:
    branches: [main]
    paths:
      - runner/**
      - personas/**
      - scenarios/**
      - surfaces/**
      - tests/**
      - Taskfile.yaml
      - .github/workflows/runner-image.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: stuttgart-things/ai-personas-runner
  REGISTRY: ghcr.io
  DAGGER_VERSION: v0.20.3
  TASK_VERSION: v3.54.0

jobs:
  build-validate:
    name: build-validate (ttl.sh)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dagger build and push (ttl.sh)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: github.com/stuttgart-things/dagger/docker@v0.90.1
          call: >-
            build-and-push
            --source .
            --dockerfile runner/Containerfile
            --repository-name ${{ env.IMAGE }}
            --registry-url ttl.sh
            --tag "${{ github.sha }}"
            --progress plain
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # From the release, checked against its checksums (arduino/setup-task
      # is not on the org's allowed-actions list).
      - name: Install Task
        run: |
          base=https://github.com/go-task/task/releases/download/$TASK_VERSION
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/task_linux_amd64.tar.gz"
          curl -fsSL "$base/task_checksums.txt" | grep ' task_linux_amd64.tar.gz$' | sha256sum -c -
          tar -xzf task_linux_amd64.tar.gz task
          sudo install -m 0755 task /usr/local/bin/task
          task --version

      # User, versions, forbidden tools, YAML of personas/scenarios, entrypoint
      # guards; no API key needed.
      - name: Smoke test
        run: task smoke IMAGE="ttl.sh/${{ env.IMAGE }}:${{ github.sha }}"

      - name: Scan image with Trivy
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: github.com/stuttgart-things/dagger/trivy@v0.90.1
          call: scan-image --image-ref="ttl.sh/${{ env.IMAGE }}:${{ github.sha }}" --severity="HIGH,CRITICAL" --trivy-version="0.64.1" export --path=/tmp/trivy-scan-report.json
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-report
          path: /tmp/trivy-scan-report.json
          retention-days: 30

      - name: Fail on fixable CRITICAL findings
        run: |
          # Gate (#24): a CRITICAL finding that has a fixed version fails the
          # build; the rest is reported only (artifact above).
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]?
            | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")
            | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\($t))"' \
            /tmp/trivy-scan-report.json > /tmp/critical-fixable.txt
          if [ -s /tmp/critical-fixable.txt ]; then
            echo "::error::CRITICAL findings with a fix available:"; cat /tmp/critical-fixable.txt; exit 1
          fi
          jq -r '[.Results[]?.Vulnerabilities[]?] | "CRITICAL \(map(select(.Severity=="CRITICAL"))|length), HIGH \(map(select(.Severity=="HIGH"))|length), fixable \(map(select((.FixedVersion//"")!=""))|length)"' \
            /tmp/trivy-scan-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          {
            echo "## Runner image validated (ttl.sh)"
            echo ""
            echo "\`ttl.sh/${{ env.IMAGE }}:${{ github.sha }}\` (expires on ttl.sh)"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish (ghcr)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dagger build and push (ghcr :sha)
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: github.com/stuttgart-things/dagger/docker@v0.90.1
          call: >-
            build-and-push
            --source .
            --dockerfile runner/Containerfile
            --repository-name ${{ env.IMAGE }}
            --registry-url ${{ env.REGISTRY }}
            --registry-username env:REGISTRY_USERNAME
            --registry-password env:REGISTRY_PASSWORD
            --tag "${{ github.sha }}"
            --progress plain
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Log in to ghcr (smoke test pulls :sha)
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      # From the release, checked against its checksums (arduino/setup-task
      # is not on the org's allowed-actions list).
      - name: Install Task
        run: |
          base=https://github.com/go-task/task/releases/download/$TASK_VERSION
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/task_linux_amd64.tar.gz"
          curl -fsSL "$base/task_checksums.txt" | grep ' task_linux_amd64.tar.gz$' | sha256sum -c -
          tar -xzf task_linux_amd64.tar.gz task
          sudo install -m 0755 task /usr/local/bin/task
          task --version

      - name: Smoke test
        run: task smoke IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}"

      - name: Scan image with Trivy
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: github.com/stuttgart-things/dagger/trivy@v0.90.1
          call: scan-image --image-ref="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}" --severity="HIGH,CRITICAL" --trivy-version="0.64.1" export --path=/tmp/trivy-scan-report.json
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-report
          path: /tmp/trivy-scan-report.json
          retention-days: 30

      - name: Fail on fixable CRITICAL findings
        run: |
          # Gate (#24): a CRITICAL finding that has a fixed version fails the
          # build; the rest is reported only (artifact above).
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]?
            | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")
            | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\($t))"' \
            /tmp/trivy-scan-report.json > /tmp/critical-fixable.txt
          if [ -s /tmp/critical-fixable.txt ]; then
            echo "::error::CRITICAL findings with a fix available:"; cat /tmp/critical-fixable.txt; exit 1
          fi
          jq -r '[.Results[]?.Vulnerabilities[]?] | "CRITICAL \(map(select(.Severity=="CRITICAL"))|length), HIGH \(map(select(.Severity=="HIGH"))|length), fixable \(map(select((.FixedVersion//"")!=""))|length)"' \
            /tmp/trivy-scan-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      # crane copy = re-tag by digest, no rebuild.
      - name: Crane re-tag :sha -> :latest
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          module: github.com/stuttgart-things/dagger/crane@v0.91.0
          call: >-
            copy
            --source ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            --target ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            --source-registry ${{ env.REGISTRY }}
            --source-username ${{ github.actor }}
            --source-password env:REGISTRY_PASSWORD
            --target-registry ${{ env.REGISTRY }}
            --target-username ${{ github.actor }}
            --target-password env:REGISTRY_PASSWORD
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## Runner image published"
            echo ""
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}\`"
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
